<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Upload Video - Multilang Translate</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      max-width: 600px;
      width: 90%;
    }
    h1 {
      color: #333;
      margin-top: 0;
      text-align: center;
    }
    .upload-form {
      margin: 30px 0;
    }
    .file-input-wrapper {
      position: relative;
      overflow: hidden;
      display: inline-block;
      width: 100%;
      margin-bottom: 20px;
    }
    .file-input-wrapper input[type=file] {
      font-size: 100px;
      position: absolute;
      left: 0;
      top: 0;
      opacity: 0;
      cursor: pointer;
    }
    .file-input-label {
      display: block;
      padding: 15px 20px;
      background: #f0f0f0;
      border: 2px dashed #999;
      border-radius: 8px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
    }
    .file-input-label:hover {
      background: #e0e0e0;
      border-color: #667eea;
    }
    .file-name {
      margin-top: 10px;
      color: #666;
      font-size: 14px;
      text-align: center;
    }
    .btn {
      padding: 12px 30px;
      border-radius: 6px;
      background: #667eea;
      color: white;
      border: none;
      cursor: pointer;
      font-size: 16px;
      width: 100%;
      transition: background 0.3s;
    }
    .btn:hover {
      background: #5568d3;
    }
    .btn:disabled {
      background: #999;
      cursor: not-allowed;
    }
    .langs-section {
      margin-top: 40px;
      padding-top: 30px;
      border-top: 1px solid #e0e0e0;
    }
    .langs-section h3 {
      color: #333;
      margin-bottom: 15px;
    }
    .lang-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
    }
    .lang-item {
      padding: 10px;
      background: #f8f9fa;
      border-radius: 6px;
      border-left: 3px solid #667eea;
      font-size: 14px;
    }
    .lang-code {
      font-weight: bold;
      color: #667eea;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎬 Video Translation & Transcription</h1>
    
    <form class="upload-form" action="/" method="post" enctype="multipart/form-data">
      <div class="file-input-wrapper">
        <label class="file-input-label" for="video-input">
          📁 Choose a video file
        </label>
        <input type="file" id="video-input" name="video" accept="video/*" required>
      </div>
      <div class="file-name" id="file-name"></div>
      <button class="btn" type="submit">Upload & Process</button>
    </form>

    <div class="langs-section">
      <h3>🌍 Supported Languages:</h3>
      <div class="lang-grid">
        {% for code, info in supported_langs.items() %}
          <div class="lang-item">
            <span class="lang-code">{{ code }}</span> — {{ info.name }}
          </div>
        {% endfor %}
      </div>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById('video-input');
    const fileName = document.getElementById('file-name');
    
    fileInput.addEventListener('change', function(e) {
      if (e.target.files.length > 0) {
        fileName.textContent = '📹 ' + e.target.files[0].name;
      } else {
        fileName.textContent = '';
      }
    });
  </script>
</body>
</html>
